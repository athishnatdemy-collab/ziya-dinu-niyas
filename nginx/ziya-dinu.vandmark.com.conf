server {
    listen 80;
    server_name ziya-dinu.vandmark.com;

    client_max_body_size 25M;

    access_log /var/log/nginx/ziya_dinu_access.log;
    error_log /var/log/nginx/ziya_dinu_error.log;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Serve static assets directly via Nginx
    location /static/ {
        alias /var/www/ziya-dinu.vandmark.com/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Forward dynamic requests to Gunicorn socket in project directory
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/var/www/ziya-dinu.vandmark.com/gunicorn.sock;
    }
}
